[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "distributed-gpu"
version = "0.1.0"
description = "A workload-defined control plane for distributing independent jobs across GPU fleets"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
license-files = ["LICENSE"]
keywords = ["gpu", "orchestration", "queue", "diffusers", "translation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Distributed Computing",
]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "Pillow>=10,<13",
  "pydantic>=2.9,<3",
  "PyYAML>=6.0,<7",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<8",
]

[project.urls]
Homepage = "https://github.com/example/distributed-gpu"
Repository = "https://github.com/example/distributed-gpu"
Issues = "https://github.com/example/distributed-gpu/issues"

[project.scripts]
dgpu = "gpu_orchestrator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gpu_orchestrator", "src/gpu_orchestrator_workloads"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
