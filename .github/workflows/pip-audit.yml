name: pip-audit

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and pip-audit
        run: |
          python -m pip install --upgrade "pip>=26.2.1"
          python -m pip install -e ".[dev]" pip-audit
      - name: Audit installed dependencies
        run: python -m pip_audit --skip-editable --desc on
