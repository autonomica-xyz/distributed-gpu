api_version: sparehour.example/v1alpha1
name: image-generate
version: "3"
description: One deterministic SDXL image generated by a pinned Diffusers model pack.
default_route: diffusers-sdxl
payload_schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  additionalProperties: false
  required: [prompt, seed]
  properties:
    prompt: {type: string, minLength: 1, maxLength: 4000}
    negative_prompt: {type: string, maxLength: 4000, default: ""}
    width: {type: integer, minimum: 512, maximum: 1024, multipleOf: 64, default: 1024}
    height: {type: integer, minimum: 512, maximum: 1024, multipleOf: 64, default: 1024}
    steps: {type: integer, minimum: 10, maximum: 50, default: 30}
    guidance_scale: {type: number, minimum: 1, maximum: 15, default: 7}
    seed: {type: integer, minimum: 0, maximum: 9223372036854775807}
inputs: []
outputs:
  - name: image
    media_types: [image/png]
    max_bytes: 33554432
    validator: image
routes:
  diffusers-sdxl:
    compatibility:
      capability: image-generate
      model_packs: [sdxl-base-1.0-fp16-76d28af]
    resources:
      gpu_count: 1
      vendor: nvidia
      min_vram_mb: 16384
      min_compute_capability: "7.5"
      min_cpu_cores: 4
      min_ram_mb: 12288
      min_disk_mb: 20480
    executor:
      type: plugin
      handler: sparehour_workloads.sdxl:SdxlExecutor
      timeout_seconds: 1800
      environment:
        SDXL_MODEL_ID: stabilityai/stable-diffusion-xl-base-1.0
        SDXL_MODEL_REVISION: 76d28af79639c28a79fa5c6c6468febd3490a37e
        SDXL_MODEL_VARIANT: fp16
        SDXL_MODEL_PACK: sdxl-base-1.0-fp16-76d28af
        SDXL_MODEL_DIR: /models/sdxl-base-1.0-fp16-76d28af
        HF_HOME: /models/huggingface
    cost:
      unit: image
      default_units_per_job: 1
      default_units_per_gpu_hour: 30
    scaling:
      min_slots: 0
      max_slots: 10
      target_completion_hours: 1
      startup_minutes: 20
retry:
  max_attempts: 3
  retryable_error_codes:
    - worker_lost
    - provider_interrupted
    - artifact_transport_failed
    - gpu_oom
    - model_download_failed
