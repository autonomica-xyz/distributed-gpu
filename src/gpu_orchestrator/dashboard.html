<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Distributed GPU — Workbench</title>
<script>(function(){try{var t=localStorage.getItem("dgpu.theme");if(t!=="light"&&t!=="dark"){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";}document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<style>
  :root {
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", "Segoe UI", Roboto, system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --bg: #f5f5f7; --surface: #ffffff; --surface-2: #f2f2f7; --surface-3: #ffffff;
    --hairline: rgba(0,0,0,.07); --hairline-2: rgba(0,0,0,.13);
    --text: #1d1d1f; --text-2: #6e6e73; --text-3: #86868b;
    --accent: #0071e3; --accent-2: #0077ed; --accent-soft: rgba(0,113,227,.12);
    --ok: #1d874b; --ok-soft: rgba(29,135,75,.12);
    --warn: #b25000; --warn-soft: rgba(179,80,0,.12);
    --bad: #d70015; --bad-soft: rgba(215,0,21,.12);
    --info: #0066cc; --info-soft: rgba(0,102,204,.12);
    --shadow-sm: 0 1px 2px rgba(0,0,0,.04), 0 1px 1px rgba(0,0,0,.03);
    --shadow-md: 0 6px 18px rgba(0,0,0,.07), 0 2px 6px rgba(0,0,0,.04);
    --shadow-lg: 0 24px 60px rgba(0,0,0,.20), 0 10px 20px rgba(0,0,0,.08);
    --radius: 12px; --radius-sm: 8px; --radius-lg: 16px;
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg: #000000; --surface: #1c1c1e; --surface-2: #2c2c2e; --surface-3: #3a3a3c;
    --hairline: rgba(255,255,255,.09); --hairline-2: rgba(255,255,255,.16);
    --text: #f5f5f7; --text-2: #a1a1a6; --text-3: #8e8e93;
    --accent: #0a84ff; --accent-2: #3a9bff; --accent-soft: rgba(10,132,255,.20);
    --ok: #30d158; --ok-soft: rgba(48,209,88,.18);
    --warn: #ff9f0a; --warn-soft: rgba(255,159,10,.18);
    --bad: #ff453a; --bad-soft: rgba(255,69,58,.18);
    --info: #64d2ff; --info-soft: rgba(100,210,255,.18);
    --shadow-sm: 0 0 0 0 transparent; --shadow-md: 0 8px 24px rgba(0,0,0,.5);
    --shadow-lg: 0 30px 70px rgba(0,0,0,.65), 0 12px 24px rgba(0,0,0,.4);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.5 var(--font); letter-spacing: -0.006em;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  ::selection { background: var(--accent-soft); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .mono, code, pre { font-family: var(--mono); }
  .tabnum, .mono { font-variant-numeric: tabular-nums; }
  .hidden { display: none !important; }
  .muted { color: var(--text-3); }

  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-thumb { background: var(--hairline-2); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-3); border: 3px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-track { background: transparent; }

  .icon { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

  /* ---- Top bar ---- */
  header.bar {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; gap: 14px; padding: 10px 22px;
    background: var(--surface);
    background: color-mix(in srgb, var(--surface) 72%, transparent);
    backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--hairline);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; letter-spacing: -0.02em; white-space: nowrap; }
  .brand .mark {
    width: 24px; height: 24px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center;
    background: linear-gradient(140deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #000));
    box-shadow: 0 2px 8px var(--accent-soft); color: #fff;
  }
  .brand .mark .icon { width: 14px; height: 14px; stroke-width: 1.8; }
  nav#tabs { display: flex; gap: 2px; align-items: center; flex-wrap: wrap; }
  nav#tabs button {
    display: inline-flex; align-items: center; gap: 7px;
    background: transparent; border: 1px solid transparent; color: var(--text-2);
    padding: 6px 11px; border-radius: var(--radius-sm); cursor: pointer;
    font: 500 13px/1 var(--font); transition: background .15s ease, color .15s ease;
  }
  nav#tabs button .icon { width: 15px; height: 15px; }
  nav#tabs button:hover { background: color-mix(in srgb, var(--text) 6%, transparent); color: var(--text); }
  nav#tabs button.active { background: var(--accent-soft); color: var(--accent); }
  .spacer { flex: 1; }
  .who { font-size: 12px; color: var(--text-2); text-align: right; line-height: 1.4; }
  .who b { color: var(--text); font-weight: 550; }
  .who .conn { display: inline-flex; align-items: center; gap: 7px; }
  .who .conn .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
  .who .sub { color: var(--text-3); font-size: 11px; }
  .icon-btn {
    width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center;
    border-radius: var(--radius-sm); background: transparent; border: 1px solid transparent;
    color: var(--text-2); cursor: pointer; transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); border-color: var(--hairline); }

  /* ---- Layout ---- */
  main { padding: 26px 22px 60px; max-width: 1280px; margin: 0 auto; }
  section { margin-bottom: 28px; }
  h2 { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  h2 .muted { font-weight: 400; font-size: 12px; }
  h3 { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 4px; }
  .grid { display: grid; gap: 14px; }
  .cards { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }

  /* ---- Cards & stats ---- */
  .card {
    background: var(--surface); border: 1px solid var(--hairline);
    border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow-sm);
  }
  .card .label { font-size: 11px; font-weight: 600; color: var(--text-3); letter-spacing: 0.05em; text-transform: uppercase; }
  .card .value { font-size: 30px; font-weight: 600; letter-spacing: -0.022em; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .card .value.state-warn { color: var(--warn); }
  .card .value.state-info { color: var(--info); }
  .card .value.state-ok { color: var(--ok); }
  .card .value.state-bad { color: var(--bad); }
  .card .sub, .sub { font-size: 12px; color: var(--text-2); margin-top: 4px; }

  /* ---- Pills & badges ---- */
  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 550;
    background: var(--surface-2); color: var(--text-2); border: 1px solid var(--hairline);
  }
  .pill.ok, .pill.warn, .pill.bad, .pill.info { border-color: transparent; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.bad { background: var(--bad-soft); color: var(--bad); }
  .pill.info { background: var(--info-soft); color: var(--info); }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 2px 10px 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 550;
    background: var(--surface-2); color: var(--text-2); border: 1px solid transparent;
  }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .state-pending, .state-leased { color: var(--warn); background: var(--warn-soft); }
  .state-running { color: var(--info); background: var(--info-soft); }
  .state-running::before { animation: pulse 1.4s ease-in-out infinite; }
  .state-succeeded { color: var(--ok); background: var(--ok-soft); }
  .state-dead-letter { color: var(--bad); background: var(--bad-soft); }
  .state-cancelled, .state-offline { color: var(--text-2); background: var(--surface-2); }
  @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }

  /* ---- Tables ---- */
  .scrollx { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm); }
  th { text-align: left; padding: 10px 14px; font-size: 11px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; color: var(--text-3); background: var(--surface-2); border-bottom: 1px solid var(--hairline); position: sticky; top: 0; }
  td { padding: 11px 14px; border-bottom: 1px solid var(--hairline); font-size: 13px; vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr { cursor: pointer; transition: background .12s ease; }
  tbody tr:hover { background: var(--surface-2); }
  .row-slot td:first-child { padding-left: 30px; color: var(--text-2); }

  /* ---- Forms ---- */
  input, select, textarea {
    background: var(--surface); color: var(--text); border: 1px solid var(--hairline-2);
    border-radius: var(--radius-sm); padding: 8px 11px; font: 13px/1.4 var(--font);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  input[type=number] { max-width: 140px; }
  textarea { min-width: 100%; resize: vertical; font-family: var(--mono); }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }

  /* ---- Buttons ---- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--accent); color: #fff; border: 1px solid transparent;
    border-radius: var(--radius-sm); padding: 8px 15px;
    font: 550 13px/1 var(--font); cursor: pointer;
    transition: background .15s ease, transform .08s ease, box-shadow .15s ease;
  }
  .btn:hover { background: var(--accent-2); }
  .btn:active { transform: scale(.98); }
  .btn.ghost { background: var(--surface-2); color: var(--text); border-color: var(--hairline); }
  .btn.ghost:hover { background: color-mix(in srgb, var(--surface-2) 82%, var(--text) 8%); }
  .btn.subtle { background: transparent; color: var(--text-2); border-color: transparent; padding: 6px 11px; }
  .btn.subtle:hover { background: var(--surface-2); color: var(--text); }
  .btn.bad { background: var(--bad); }
  .btn.bad:hover { background: color-mix(in srgb, var(--bad) 86%, #000); }

  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .err { color: var(--bad); font-size: 12px; margin-top: 8px; }
  .empty { color: var(--text-3); padding: 40px; text-align: center; font-size: 13px; }
  .spin::after { content: ""; display: inline-block; width: 12px; height: 12px; border: 2px solid var(--text-3); border-top-color: transparent; border-radius: 50%; animation: sp .8s linear infinite; margin-left: 8px; vertical-align: -2px; }
  @keyframes sp { to { transform: rotate(360deg); } }

  /* ---- Overlay & dialogs ---- */
  .overlay {
    position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.25); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    animation: fade .2s ease;
  }
  [data-theme="dark"] .overlay { background: rgba(0,0,0,.55); }
  .dialog {
    background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg); padding: 26px; width: 420px; max-width: 92vw;
    max-height: calc(100vh - 48px); overflow-y: auto;
    animation: pop .24s cubic-bezier(.32,.72,0,1);
  }
  .dialog h3 { margin-bottom: 4px; }
  .dialog p { color: var(--text-2); margin: 0 0 4px; font-size: 13px; }
  .dialog label { display: block; font-size: 12px; color: var(--text-2); margin: 16px 0 6px; font-weight: 500; }
  .dialog .row { display: flex; gap: 10px; margin-top: 18px; }
  .dialog .row .btn { flex: 1; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop { from { transform: scale(.96) translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* ---- Drawer (job detail) ---- */
  .drawer {
    position: fixed; top: 0; right: 0; height: 100%; width: 560px; max-width: 96vw;
    background: var(--bg); border-left: 1px solid var(--hairline); box-shadow: var(--shadow-lg);
    z-index: 40; transform: translateX(100%); transition: transform .3s cubic-bezier(.32,.72,0,1); overflow-y: auto;
  }
  .drawer.open { transform: none; }
  .drawer .head {
    position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 10px; padding: 14px 18px;
    background: var(--bg);
    background: color-mix(in srgb, var(--bg) 78%, transparent);
    backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--hairline);
  }
  .drawer .body { padding: 18px; }
  .kv { display: grid; grid-template-columns: 120px 1fr; gap: 6px 12px; margin-bottom: 16px; }
  .kv dt { color: var(--text-3); font-size: 12px; }
  .kv dd { margin: 0; word-break: break-word; }
  pre.box { background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--radius-sm); padding: 12px; overflow-x: auto; font-size: 12px; box-shadow: var(--shadow-sm); }
  .timeline { border-left: 2px solid var(--hairline); margin: 8px 0 8px 6px; padding-left: 16px; }
  .timeline .ev { margin-bottom: 12px; }
  .timeline .ev .t { font-size: 11px; color: var(--text-3); }
  .timeline .ev .k { font-weight: 550; margin-top: 2px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; margin-bottom: 5px; font-weight: 500; }
  .field label .req { color: var(--bad); }
  .field .hint { color: var(--text-3); font-size: 11px; margin-top: 4px; }
  details summary { cursor: pointer; color: var(--text-2); }
  .footer { color: var(--text-3); font-size: 11px; text-align: center; padding: 10px 20px 30px; }

  @media (max-width: 820px) {
    header.bar { padding: 10px 14px; gap: 10px; }
    nav#tabs button .label { display: none; }
    nav#tabs button { padding: 6px 9px; }
    main { padding: 18px 14px 50px; }
    .drawer { width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }
</style>
</head>
<body>
<div id="app">
  <header class="bar hidden" id="topbar">
    <div class="brand"><span class="mark"><svg class="icon" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2.5"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M9 1.5v2.5M15 1.5v2.5M9 20v2.5M15 20v2.5M1.5 9h2.5M1.5 15h2.5M20 9h2.5M20 15h2.5"/></svg></span>GPU Workbench</div>
    <nav id="tabs">
      <button data-tab="overview" class="active"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span class="label">Overview</span></button>
      <button data-tab="fleet"><svg class="icon" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M1 9h3M1 15h3M20 9h3M20 15h3"/></svg><span class="label">GPUs</span></button>
      <button data-tab="queues"><svg class="icon" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="7" cy="6" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="17" cy="18" r="1"/></svg><span class="label">Queues</span></button>
      <button data-tab="jobs"><svg class="icon" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span class="label">Jobs</span></button>
      <button data-tab="workloads"><svg class="icon" viewBox="0 0 24 24"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg><span class="label">Workloads</span></button>
      <button data-tab="admin" id="tab-admin" class="hidden"><svg class="icon" viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V5l-8-3Z"/><path d="m9 12 2 2 4-4"/></svg><span class="label">Admin</span></button>
    </nav>
    <div class="spacer"></div>
    <div class="who" id="who"></div>
    <button class="icon-btn" id="theme-btn" title="Toggle theme" aria-label="Toggle theme"></button>
    <button class="icon-btn" id="refresh-btn" title="Refresh now" aria-label="Refresh"><svg class="icon" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
    <button class="btn subtle" id="disconnect-btn"><svg class="icon" viewBox="0 0 24 24" style="width:15px;height:15px"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></svg>Sign out</button>
  </header>

  <main id="main" class="hidden"></main>
  <div class="footer hidden" id="autofoot"></div>
</div>

<!-- Connect overlay -->
<div class="overlay" id="connect">
  <form class="dialog" id="connect-form">
    <div class="brand" style="margin-bottom: 14px"><span class="mark"><svg class="icon" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2.5"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M9 1.5v2.5M15 1.5v2.5M9 20v2.5M15 20v2.5M1.5 9h2.5M1.5 15h2.5M20 9h2.5M20 15h2.5"/></svg></span>GPU Workbench</div>
    <h3>Connect to a control plane</h3>
    <p>Sign in with a scoped bearer token. The workbench keeps your token only in this browser tab.</p>
    <label for="c-endpoint">Control plane URL</label>
    <input id="c-endpoint" style="width:100%" placeholder="https://gpu-control.example.com" />
    <label for="c-token">Bearer token</label>
    <input id="c-token" style="width:100%" placeholder="dgpu… or your issued token" autocomplete="off" />
    <div class="err" id="c-err"></div>
    <div class="row"><button type="submit" class="btn">Connect</button></div>
  </form>
</div>

<!-- Job detail drawer -->
<aside class="drawer" id="drawer"></aside>

<!-- Generic modal -->
<div class="overlay hidden" id="modal-host">
  <div class="dialog" id="modal-dialog" style="width:560px"></div>
</div>

<script>
"use strict";
const STORE_KEY = "dgpu.workbench.v1";
const THEME_KEY = "dgpu.theme";
const REFRESH_MS = 5000;
const JOBS_PAGE_SIZE = 50;
const OFFERS_PAGE_SIZE = 10;
const QUEUES_PAGE_SIZE = 20;
const ICON = {
  sun: '<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon: '<svg class="icon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>'
};
let state = { endpoint: "", token: "", role: "", subject: "", projectId: null,
              tab: "overview", jobsFilter: {state:"", workload:"", gpu:"", q:""}, workloads: [], overview: null,
              jobsPage: 0, queuesPage: 0, queueWindow: 24, queues: [], gpuSlots: [], capacity: [], capacityPages: {} };
let timer = null;
let jobsFetchGeneration = 0;
const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));

function el(tag, props={}, ...kids) {
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(props)) {
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k === "html") n.innerHTML = v;
    else if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2), v);
    else if (k === "dataset") Object.assign(n.dataset, v);
    else n.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    n.appendChild(typeof kid === "string" ? document.createTextNode(kid) : kid);
  }
  return n;
}

/* ---- Theme ---- */
function setTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
  updateThemeIcon();
}
function toggleTheme() {
  setTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
}
function updateThemeIcon() {
  const b = $("#theme-btn");
  if (b) b.innerHTML = document.documentElement.getAttribute("data-theme") === "dark" ? ICON.sun : ICON.moon;
}

async function api(path, opts={}) {
  const headers = Object.assign({ "Authorization": "Bearer " + state.token }, opts.headers || {});
  if (opts.body !== undefined && !headers["Content-Type"]) headers["Content-Type"] = "application/json";
  let res;
  try {
    res = await fetch(state.endpoint + path, { method: opts.method || "GET", headers, body: opts.body });
  } catch (e) {
    const err = new Error("Network error reaching " + state.endpoint + " — " + e.message);
    err.status = 0; throw err;
  }
  if (res.status === 204) return { ok: true, status: 204, json: null };
  const ctype = res.headers.get("content-type") || "";
  const body = ctype.includes("json") ? await res.json() : await res.text();
  if (!res.ok) {
    const err = new Error((body && body.detail) || (body && body.error) || ("HTTP " + res.status));
    err.status = res.status; err.body = body; throw err;
  }
  return { ok: true, status: res.status, json: body };
}
async function apiRaw(path) {
  const res = await fetch(state.endpoint + path, { headers: { "Authorization": "Bearer " + state.token } });
  if (!res.ok) throw new Error("download failed: HTTP " + res.status);
  return res;
}

function short(s, n=10) { return s && s.length > n ? s.slice(0,n) + "…" : (s||""); }
function relTime(iso) {
  if (!iso) return "—";
  const then = new Date(iso + (iso.endsWith("Z") || iso.includes("+") ? "" : "Z"));
  const diff = (Date.now() - then.getTime())/1000;
  if (diff < 0) return "just now";
  if (diff < 60) return Math.floor(diff) + "s ago";
  if (diff < 3600) return Math.floor(diff/60) + "m ago";
  if (diff < 86400) return Math.floor(diff/3600) + "h ago";
  return Math.floor(diff/86400) + "d ago";
}
function dur(ms) {
  if (ms == null) return "—";
  if (ms < 1000) return ms + "ms";
  const s = ms/1000;
  if (s < 60) return s.toFixed(1) + "s";
  const m = s/60;
  if (m < 60) return m.toFixed(1) + "m";
  return (m/60).toFixed(1) + "h";
}
function age(iso) { return iso ? relTime(iso) : "—"; }
function stateBadge(s) { return `<span class="badge state-${s}">${s}</span>`; }
function esc(s) { return String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function patchTable(host, heads, rowsHtml, keyAttr) {
  const existing=host.querySelector("table");

  const scratch=document.createElement("tbody"); scratch.innerHTML=rowsHtml;
  const body=existing.tBodies[0];

    const key=fresh.getAttribute(keyAttr)||`new-${i}`; const row=old.get(key);

  $("#f-state").addEventListener("change", e => { state.jobsFilter.state = e.target.value; state.jobsPage=0; fetchJobs(); });

    const row=e.target.closest("tr[data-job]"); if(row) openJob(row.dataset.job);
  });

async function loadGpuSlots() {
  if (!state.overview?.can_administer) return;
  try {
    const agents = (await api("/v1/control/agents")).json;
    state.gpuSlots = agents.flatMap(a => (a.slots||[]).map(s => ({
      id:s.id, model:s.model, agent_id:a.id, provider:a.provider, historical:!!a.historical
    }))).sort((a,b)=>(Number(a.historical)-Number(b.historical))||(a.model+a.agent_id).localeCompare(b.model+b.agent_id));
    const sel=$("#f-gpu"); if (!sel) return;
    sel.innerHTML=`<option value="">all GPUs</option>`+state.gpuSlots.map(s=>`<option value="${esc(s.id)}" ${state.jobsFilter.gpu===s.id?"selected":""}>${s.historical?"past · ":""}${esc(s.model)} · ${esc(s.agent_id)}</option>`).join("");
    if (state.tab==="jobs") fetchJobs();
  } catch (_) { /* project clients can still inspect assigned GPU in rows */ }
}
function gpuForJob(j) {
  const slot=state.gpuSlots.find(s=>s.id===j.slot_id);
  return slot ? `${slot.model} · ${slot.agent_id}` : (j.slot_id||j.worker_id||"—");
}
async function fetchJobs() {
  const generation=++jobsFetchGeneration;
  const f = state.jobsFilter;
  const params = new URLSearchParams();
  if (f.state) params.set("state", f.state);
  if (f.workload) params.set("workload", f.workload);
  if (f.gpu) params.set("slot_id", f.gpu);
  if (f.q) params.set("q", f.q);
  params.set("limit", String(JOBS_PAGE_SIZE+1));
  params.set("offset", String(state.jobsPage*JOBS_PAGE_SIZE));
  const host = $("#jobs-host");
  try {
    let jobs = (await api("/v1/jobs?" + params)).json;
    if(generation!==jobsFetchGeneration)return;
    if (!state.gpuSlots.length) {
      const seen=new Set();
      state.gpuSlots=jobs.filter(j=>j.slot_id&&!seen.has(j.slot_id)&&seen.add(j.slot_id)).map(j=>({id:j.slot_id,model:j.slot_id,agent_id:j.worker_id||"",provider:""}));
      const sel=$("#f-gpu"); if(sel) sel.innerHTML=`<option value="">all GPUs</option>`+state.gpuSlots.map(s=>`<option value="${esc(s.id)}" ${f.gpu===s.id?"selected":""}>${esc(s.model)} · ${esc(s.agent_id)}</option>`).join("");
    }
    const hasNext=jobs.length>JOBS_PAGE_SIZE; jobs=jobs.slice(0,JOBS_PAGE_SIZE);
    if (!jobs.length) { host.innerHTML = empty("No jobs match."); renderJobsPager(false); return; }
    const rows = jobs.map(j => {
      const sample = jobSample(j);
      return `<tr data-job="${esc(j.id)}">
        <td class="mono"><b>${short(j.id,12)}</b></td>
        <td>${esc(j.project_id)}</td>
        <td>${esc(j.workload)} <span class="muted">/ ${esc(j.route)}</span></td>
        <td>${stateBadge(j.state)}</td>
        <td title="${esc(j.slot_id||"")}">${esc(gpuForJob(j))}</td>
        <td class="tabnum">${j.priority||0}</td>
        <td class="tabnum">${j.attempts||0}/${j.max_attempts||0}</td>
        <td class="mono">${age(j.created_at)}</td>
        <td class="mono">${dur(j.finished_at ? durMs(j) : null)}</td>
        <td class="mono" style="max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(sample)}">${esc(sample)}</td>
      </tr>`;
    }).join("");
    patchTable(host, ["Job","Project","Workload","State","GPU / worker","Prio","Tries","Age","Runtime","Detail"], rows, "data-job");
    renderJobsPager(hasNext);
  } catch (e) {
    if(!host.querySelector("table")) host.innerHTML=errBox(e);
    else host.title=e.message;
  }
}
function renderJobsPager(hasNext){
  const host=$("#jobs-pager"); if(!host)return;
  const signature=`${state.jobsPage}:${hasNext}`; if(host.dataset.signature===signature)return; host.dataset.signature=signature;
  host.innerHTML=`<span class="sub">Page ${state.jobsPage+1}</span><button class="btn ghost" id="jobs-prev" ${state.jobsPage===0?"disabled":""}>Previous</button><button class="btn ghost" id="jobs-next" ${hasNext?"":"disabled"}>Next</button>`;
  $("#jobs-prev").addEventListener("click",()=>{if(state.jobsPage>0){state.jobsPage--;fetchJobs();}});
  $("#jobs-next").addEventListener("click",()=>{if(hasNext){state.jobsPage++;fetchJobs();}});
}
function durMs(j){ if(!j.started_at) return null; const end=j.finished_at?new Date(j.finished_at+(j.finished_at.endsWith("Z")||j.finished_at.includes("+")?"":"Z")):new Date(); const st=new Date(j.started_at+(j.started_at.endsWith("Z")||j.started_at.includes("+")?"":"Z")); return end-st; }
function jobSample(j){ const p=j.payload||{}; return p.prompt||p.message||(p.text?p.text.slice(0,60):JSON.stringify(p).slice(0,60)); }

function bindJobDetail(j) {
  const drawer = $("#drawer");
  $$("button[data-download]", drawer).forEach(b => b.addEventListener("click", async () => {
    try { const r = await apiRaw(`/v1/jobs/${j.id}/artifacts/${b.dataset.download}`);
      const blob = await r.blob();
      const url = URL.createObjectURL(blob); const a = document.createElement("a");
      a.href = url; a.download = `${b.dataset.name}-${b.dataset.download.slice(0,12)}`; a.click();
      URL.revokeObjectURL(url);
    } catch (e) { alert(e.message); }
  }));
  const cancel = $("#cancel-job", drawer); if (cancel) cancel.addEventListener("click", async () => {
    if (!confirm("Cancel this job?")) return;
    try { await api(`/v1/jobs/${j.id}`, { method: "DELETE" }); openJob(j.id); } catch (e){ alert(e.message); }
  });
  const resub = $("#resubmit", drawer); if (resub) resub.addEventListener("click", () => openSubmit(j.workload, j.route, j.payload, j.priority));
}

/* ---------------- Submit (schema-bounded) ---------------- */
function openSubmit(workloadName, routeName, presetPayload, presetPriority) {
  const w = state.workloads.find(x => x.name === (workloadName || state.workloads[0]?.name));
  if (!w) { alert("No workloads loaded."); return; }
  const routeNames = Object.keys(w.routes||{});
  const route = routeName || w.default_route || routeNames[0];
  const preset = presetPayload || {};
  const fields = renderSchemaFields(w.payload_schema, preset);
  const projDefault = state.role === "client" ? (state.subject||"") : "";
  const projectInput = state.role === "client"
    ? `<input type="hidden" id="s-project" value="${esc(state.subject||"")}" /><div class="hint">Scoped to your project <b>${esc(state.subject||"")}</b></div>`
    : `<input id="s-project" value="${esc(projDefault)}" placeholder="project-id (lowercase)" style="width:100%" />`;
  modal(`
    <h3>Submit a job — ${esc(w.name)}</h3>
    <p style="font-size:12px;margin-bottom:14px">${esc(w.description||"")}</p>
    <div class="toolbar" style="margin-bottom:4px">
      <label style="color:var(--text-2);font-size:12px">Route
        <select id="s-route">${routeNames.map(r=>`<option value="${r}" ${r===route?"selected":""}>${r}${r===w.default_route?" (default)":""}</option>`).join("")}</select></label>
      <label style="color:var(--text-2);font-size:12px">Priority <input id="s-priority" type="number" value="${presetPriority!=null?presetPriority:0}" /></label>
    </div>
    <div class="field"><label>Project</label>${projectInput}</div>
    <div class="field"><label>Idempotency key <span class="muted">(optional)</span></label><input id="s-idem" style="width:100%" placeholder="auto" /></div>
    <hr style="border:0;border-top:1px solid var(--hairline);margin:16px 0" />
    <div id="schema-fields">${fields}</div>
    <div class="err" id="s-err"></div>
    <div class="row" style="margin-top:14px"><button class="btn ghost" id="modal-cancel">Cancel</button><button class="btn" id="modal-submit">Submit job</button></div>
  `);
  $("#modal-cancel").addEventListener("click", closeModal);
  $("#modal-submit").addEventListener("click", () => submitFromModal(w));
}
function renderSchemaFields(schema, preset) {
  const props = schema?.properties||{};
  const req = new Set(schema?.required||[]);
  return Object.entries(props).map(([name, s]) => {
    const required = req.has(name);
    const lab = `<label>${esc(name)} ${required?'<span class="req">*</span>':''} <span class="muted" style="font-weight:400">(${esc(s.type||"any")})</span></label>`;
    let input;
    const val = preset[name] !== undefined ? preset[name] : s.default;
    const def = val !== undefined ? `value="${esc(val)}"` : "";
    if (s.enum) {
      input = `<select id="f-${name}">${s.enum.map(o=>`<option value="${esc(o)}" ${val!==undefined&&String(val)===String(o)?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
    } else if (s.type === "boolean") {
      input = `<input id="f-${name}" type="checkbox" ${val?"checked":""} />`;
    } else if (s.type === "integer" || s.type === "number") {
      const step = s.multipleOf!=null?`step="${s.multipleOf}"`:(s.type==="integer"?'step="1"':'step="any"');
      input = `<input id="f-${name}" type="number" ${step} ${s.minimum!=null?`min="${s.minimum}"`:""} ${s.maximum!=null?`max="${s.maximum}"`:""} ${def} style="max-width:240px" />`;
    } else {
      const longText = !s.maxLength || s.maxLength > 120 || name.includes("prompt") || name === "message";
      input = longText
        ? `<textarea id="f-${name}" rows="${name.includes("negative")?2:3}" ${s.maxLength?`maxlength="${s.maxLength}"`:""}>${val!==undefined?esc(val):""}</textarea>`
        : `<input id="f-${name}" type="text" ${s.maxLength?`maxlength="${s.maxLength}"`:""} ${def} ${s.pattern?`pattern="${esc(s.pattern)}"`:""} style="width:100%" />`;
    }
    const hint = [];
    if (s.minimum!=null) hint.push("min "+s.minimum);
    if (s.maximum!=null) hint.push("max "+s.maximum);
    if (s.multipleOf!=null) hint.push("multiple of "+s.multipleOf);
    if (s.maxLength!=null) hint.push("≤ "+s.maxLength+" chars");
    return `<div class="field">${lab}${input}${hint.length?`<div class="hint">${hint.join(" · ")}</div>`:""}</div>`;
  }).join("") || `<p class="empty">This workload takes no payload fields.</p>`;
}
async function submitFromModal(w) {
  const err = $("#s-err"); err.textContent = "";
  const payload = {};
  const props = w.payload_schema?.properties||{};
  const required = new Set(w.payload_schema?.required||[]);
  for (const name of Object.keys(props)) {
    const s = props[name]; const node = $("#f-"+name);
    if (!node) continue;
    let val;
    if (s.type === "boolean") val = node.checked;
    else { val = node.value; if (val === "") { if (required.has(name)) { err.textContent = name + " is required"; return; } continue; }
      if (s.type === "integer") val = parseInt(val, 10);
      else if (s.type === "number") val = parseFloat(val);
    }
    payload[name] = val;
  }
  const projectId = $("#s-project").value.trim();
  if (!projectId) { err.textContent = "project is required"; return; }
  const body = { project_id: projectId, workload: w.name, route: $("#s-route").value, priority: parseInt($("#s-priority").value||"0",10), payload };
  const idem = $("#s-idem").value.trim();
  const headers = {}; if (idem) headers["Idempotency-Key"] = idem;
  try {
    const { json } = await api("/v1/jobs", { method: "POST", body: JSON.stringify(body), headers });
    closeModal(); state.tab = "jobs"; showTab("jobs");
    setTimeout(() => openJob(json.id), 150);
  } catch (e) { err.textContent = e.message; }
}

function offerAvailability(o) {
  return o.available_count == null ? "unknown" : `${o.available_count} available`;
}
const MONTHLY_BILLING_HOURS = 730;
function offerPrice(o) { return `$${Number(o.hourly_cost_usd||0).toFixed(4)}/h`; }
function offerMonthly(o, count=1) { return `$${(Number(o.hourly_cost_usd||0)*count*MONTHLY_BILLING_HOURS).toFixed(2)}/mo`; }
function offerLabel(o) {
  const priority = o.priority ? ` · ${o.priority}` : "";
  return `${o.gpu_model}${priority} · ${offerPrice(o)} · ${offerMonthly(o)} · ${offerAvailability(o)}`;
}

async function loadCapacity() {
  const host = $("#cap-host"); if (!host) return;
  let caps;
  try { caps = (await api("/v1/control/capacity")).json; }
  catch (e) {
    host.innerHTML = `<div class="card">Provider deploys are not configured on this control plane.
      Set <span class="mono">DGPU_PUBLIC_URL</span> (and provider API keys) to enable worker deployment.
      ${e.status===404?"":"<div class=\"sub\">"+esc(e.message)+"</div>"}</div>`;
    return;
  }
  state.capacity = caps;
  renderCapacity();
}
function renderCapacity() {
  const host=$("#cap-host"), caps=state.capacity||[]; if(!host)return;
  if (!caps.length) { host.innerHTML = empty("No pool policies found in the pools directory."); return; }
  host.innerHTML = caps.map(c => {
    const p = c.pool, plan = c.plan || {};
    const provRows = (plan.providers||[]).map(pr => {
      const offers = pr.offers||[];
      const usable = offers.filter(o=>o.available_count!==0).sort((a,b)=>Number(a.hourly_cost_usd)-Number(b.hourly_cost_usd));
      const cheapest = usable[0];
      const status = pr.blocked_reason
        ? `<span class="pill warn">${esc(pr.blocked_reason)}</span>`
        : cheapest
          ? `<span class="pill ${cheapest.available_count==null?"warn":"ok"}">${cheapest.available_count==null?"availability unknown":"capacity found"}</span>`
          : `<span class="pill warn">no live capacity</span>`;
      const canDeploy = pr.provider!=="local" && p.providers[pr.provider]?.enabled && !pr.blocked_reason && cheapest;
      return `<tr><td><b>${esc(pr.provider)}</b></td>
        <td class="tabnum">${pr.credit_usd!=null?"$"+Number(pr.credit_usd).toFixed(2):"unknown"}</td>
        <td>${status}</td>
        <td>${cheapest?`${esc(cheapest.gpu_model)}${cheapest.priority?` <span class="pill">${esc(cheapest.priority)}</span>`:""}`:"—"}</td>
        <td class="tabnum">${cheapest?`${offerPrice(cheapest)}<div class="sub" style="margin:0">${offerMonthly(cheapest)}</div>`:"—"}</td>
        <td>${cheapest?esc(offerAvailability(cheapest)):"—"}</td>
        <td>${canDeploy?`<button class="btn subtle" data-deploy="${esc(p.id)}" data-provider="${esc(pr.provider)}">Choose & deploy…</button>`:""}</td></tr>`;
    }).join("");
    const allOfferRows = (plan.providers||[]).flatMap(pr => (pr.offers||[]).map(o => `<tr>
      <td><b>${esc(pr.provider)}</b></td><td>${esc(o.gpu_model)}</td>
      <td>${o.priority?`<span class="pill">${esc(o.priority)}</span>`:"market"}</td>
      <td><span class="pill ${o.available_count===0?"bad":o.available_count==null?"warn":"ok"}">${esc(offerAvailability(o))}</span></td>
      <td class="tabnum"><b>${offerPrice(o)}</b><div class="sub" style="margin:0">$${(Number(o.hourly_cost_usd||0)*24).toFixed(2)}/day · ${offerMonthly(o)}</div></td>
      <td class="sub" style="margin:0">${esc(o.price_source||"provider")}${o.availability_status?` · ${esc(o.availability_status)} availability`:""}</td></tr>`));
    const maxPage=Math.max(0,Math.ceil(allOfferRows.length/OFFERS_PAGE_SIZE)-1);
    const offerPage=Math.min(state.capacityPages[p.id]||0,maxPage); state.capacityPages[p.id]=offerPage;
    const offerRows=allOfferRows.slice(offerPage*OFFERS_PAGE_SIZE,(offerPage+1)*OFFERS_PAGE_SIZE);
    const offerPager=allOfferRows.length>OFFERS_PAGE_SIZE?`<div class="toolbar" style="justify-content:flex-end"><span class="sub">Offers page ${offerPage+1} of ${maxPage+1}</span><button class="btn ghost" data-offer-page="${offerPage-1}" data-pool="${esc(p.id)}" ${offerPage===0?"disabled":""}>Previous</button><button class="btn ghost" data-offer-page="${offerPage+1}" data-pool="${esc(p.id)}" ${offerPage===maxPage?"disabled":""}>Next</button></div>`:"";
    const target = plan.target_slots!=null?plan.target_slots:"—";
    return `<div class="card" style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:start;gap:10px">
        <div><b>${esc(p.id)}</b> <span class="muted">${esc(p.workload)} / ${esc(p.route)}</span>
          <div class="sub">capability <span class="mono">${esc(c.capability)}</span> · slots ${plan.current_slots ?? 0} current → ${target} target</div>
          <div class="sub">queued ${plan.queued_jobs ?? 0} jobs (${fmtUnits(plan.queued_units||0)} units) · ${esc(plan.reason||plan.error||"")}</div></div>
        ${plan.blocked_reason?`<span class="pill warn">${esc(plan.blocked_reason)}</span>`:""}
      </div>
      ${provRows?table(["Provider","Credit","Status","Cheapest eligible","Cost","Availability",""],provRows):empty("No provider policies in this pool.")}
      ${offerRows.length?`<div class="sub" style="margin:12px 0 5px">Priced candidates — availability is a preflight signal, not an allocation guarantee.</div>${table(["Provider","GPU class","Priority","Availability","Cost","Source"],offerRows.join(""))}${offerPager}`:""}
    </div>`;
  }).join("");
  $$("#cap-host button[data-deploy]").forEach(b => b.addEventListener("click", () =>
    openDeployModal(b.dataset.deploy, b.dataset.provider)));
  $$("#cap-host button[data-offer-page]").forEach(b=>b.addEventListener("click",()=>{
    state.capacityPages[b.dataset.pool]=Math.max(0,Number(b.dataset.offerPage)); renderCapacity();
  }));
}

function openDeployModal(poolId, provider) {

  const providerPlan = (cap?.plan?.providers||[]).find(p=>p.provider===provider);
  const offers = (providerPlan?.offers||[]).filter(o=>o.available_count!==0)

  if (!offers.length) {
    modal(`<h3>No deployable ${esc(provider)} offer</h3><p>Refresh capacity and choose a provider with eligible capacity.</p>
      <div class="row"><button class="btn ghost" id="modal-cancel">Close</button></div>`);
    $("#modal-cancel").addEventListener("click", closeModal); return;
  }
  const options = offers.map(o=>`<option value="${esc(o.offer_id)}">${esc(offerLabel(o))}</option>`).join("");
  modal(`<h3>Choose capacity — ${esc(provider)} / ${esc(poolId)}</h3>
    <p style="font-size:12px">Operator-initiated and billed until Destroy. Token expiry does not stop provider billing.</p>
    <div class="field"><label>GPU class and priority</label><select id="d-offer" style="width:100%">${options}</select></div>
    <div class="field"><label>Workers <span class="muted">(1–5)</span></label><input id="d-count" type="number" min="1" max="5" value="1" style="max-width:120px" /></div>
    <div class="field"><label>Token lifetime (hours) <span class="muted">(1–168)</span></label><input id="d-expires" type="number" min="1" max="168" value="24" style="max-width:120px" /></div>
    <div class="card" id="d-cost" style="margin-top:12px"></div>
    <div class="err" id="d-err"></div>
    <div class="row" style="margin-top:14px"><button class="btn ghost" id="modal-cancel">Cancel</button><button class="btn bad" id="d-go">Deploy</button></div>
    <div id="d-out" style="margin-top:10px"></div>`);
  const selected = () => offers.find(o=>o.offer_id===$("#d-offer").value) || offers[0];

    const o=selected(), count=Math.max(1,Math.min(5,parseInt($("#d-count").value||"1",10)));

    $("#d-cost").innerHTML = `<b>${esc(o.gpu_model)}</b> ${o.priority?`<span class="pill">${esc(o.priority)}</span>`:""}
      <div class="sub">${offerPrice(o)} each · <b>$${fleet.toFixed(4)}/h</b> for ${count} worker${count===1?"":"s"} · $${(fleet*24).toFixed(2)}/day · <b>${offerMonthly(o,count)}</b></div>
      <div class="sub">Monthly estimate uses 730 continuously billed hours; billing stops only after verified Destroy.</div>
      <div class="sub">${esc(offerAvailability(o))} · ${esc(o.price_source||"provider price")}${o.availability_status==="unknown"?" · allocation not guaranteed":""}</div>`;
    $("#d-err").textContent = over?`Only ${o.available_count} currently available for this offer.`:"";
    $("#d-go").disabled=over; $("#d-go").textContent=`Deploy · $${fleet.toFixed(4)}/h`;
  };
  $("#modal-cancel").addEventListener("click", closeModal);
  $("#d-offer").addEventListener("change",updateCost); $("#d-count").addEventListener("input",updateCost); updateCost();
  $("#d-go").addEventListener("click", async () => {
    $("#d-err").textContent=""; const o=selected();
    try {
      const { json } = await api("/v1/control/deployments", { method:"POST", body: JSON.stringify({
        pool_id: poolId, provider, offer_id:o.offer_id, count: parseInt($("#d-count").value||"1",10),
        expires_hours: parseInt($("#d-expires").value||"24",10) })});
      const rows = json.map(r=>`<tr><td class="mono">${esc(r.worker_id)}</td><td>${esc(r.provider)}</td><td class="mono">${short(r.resource_id,14)}</td><td><span class="badge state-${r.state==="failed"?"dead-letter":"leased"}">${esc(r.state)}</span></td><td class="tabnum">${r.hourly_cost_usd!=null?"$"+Number(r.hourly_cost_usd).toFixed(4)+"/h · $"+(Number(r.hourly_cost_usd)*MONTHLY_BILLING_HOURS).toFixed(2)+"/mo":"—"}</td><td class="sub" style="margin:0">${esc(r.detail||"")}</td></tr>`).join("");
      $("#d-out").innerHTML = table(["Worker","Provider","Resource","State","Cost","Detail"],rows);
      setTimeout(()=>{ closeModal(); loadDeployments(); loadCapacity(); }, 2500);

async function loadTokens(){
  const host=$("#token-host"); if(!host)return;
  if(state.role!=="admin"){host.innerHTML=empty("Only an admin token can inspect credential metadata.");return;}
  try{state.tokens=(await api("/v1/control/tokens")).json;renderTokenData();}catch(e){host.innerHTML=errBox(e);}
}
function renderTokenData(){
  const host=$("#token-host");if(!host)return;const tokens=[...(state.tokens||[])];
  if(!tokens.length){host.innerHTML=empty("No credentials have been issued.");return;}
  const sort=state.tokenSort||{field:"status",direction:"asc"},statusRank={active:0,expired:1,revoked:2};
  tokens.sort((a,b)=>{
    const av=sort.field==="status"?statusRank[a.status]:a[sort.field],bv=sort.field==="status"?statusRank[b.status]:b[sort.field];
    if(av==null&&bv==null)return a.id.localeCompare(b.id);if(av==null)return 1;if(bv==null)return -1;
    const cmp=sort.field==="status"?av-bv:new Date(av).getTime()-new Date(bv).getTime();
    return (sort.direction==="asc"?cmp:-cmp)||a.id.localeCompare(b.id);
  });
  const tone=s=>s==="active"?"succeeded":s==="expired"?"leased":"cancelled";
  patchTable(host,["Token ID","Role / subject","Scopes","Status","Last used","Expires","Issued","Updated",""],tokens.map(t=>`<tr data-token-key="${esc(t.id)}">
    <td class="mono"><b>${esc(t.id)}</b></td><td><span class="pill">${esc(t.role)}</span> ${esc(t.subject)}</td>
    <td><code>${esc(JSON.stringify(t.scopes||{}))}</code></td><td><span class="badge state-${tone(t.status)}">${esc(t.status)}</span>${t.revoked_at?`<div class="sub">${relTime(t.revoked_at)}</div>`:""}</td>
    <td class="mono">${t.last_used_at?relTime(t.last_used_at):"never"}</td><td class="mono">${t.expires_at?relTime(t.expires_at):"never"}</td><td class="mono">${relTime(t.created_at)}</td><td class="mono">${relTime(t.updated_at)}</td>
    <td>${t.status!=="revoked"?`<button class="btn subtle" data-token-edit="${esc(t.id)}">Edit</button> <button class="btn subtle" data-token-revoke="${esc(t.id)}">Revoke</button>`:""}</td></tr>`).join(""),"data-token-key");
}
function openEditToken(t){
  if(!t)return;
  const expiry=t.expires_at?new Date(t.expires_at).toISOString().slice(0,16):"";
  modal(`<h3>Edit token <span class="mono">${esc(t.id)}</span></h3><p class="muted">Changes apply to the existing credential immediately. Token ID and secret cannot be changed.</p>
    <div class="field"><label>Role</label><select id="te-role">${["admin","client","agent","controller"].map(r=>`<option ${t.role===r?"selected":""}>${r}</option>`).join("")}</select></div>
    <div class="field"><label>Subject</label><input id="te-subject" value="${esc(t.subject)}" style="width:100%" /></div>
    <div class="field"><label>Scopes (JSON object)</label><textarea id="te-scopes" rows="5">${esc(JSON.stringify(t.scopes||{},null,2))}</textarea></div>
    <div class="field"><label>Expires at <span class="muted">(blank means never)</span></label><input id="te-expires" type="datetime-local" value="${esc(expiry)}" /></div>
    <div class="err" id="te-err"></div><div class="row" style="margin-top:14px"><button class="btn ghost" id="te-cancel">Cancel</button><button class="btn" id="te-save">Save changes</button></div>`);
  $("#te-cancel").addEventListener("click",closeModal);
  $("#te-save").addEventListener("click",async()=>{
    const err=$("#te-err");err.textContent="";let scopes;
    try{scopes=JSON.parse($("#te-scopes").value||"{}");if(!scopes||Array.isArray(scopes)||typeof scopes!=="object")throw new Error("must be an object");}catch(e){err.textContent="Scopes must be a JSON object.";return;}
    const subject=$("#te-subject").value.trim();if(!subject){err.textContent="Subject is required.";return;}
    const value=$("#te-expires").value;
    try{await api("/v1/control/tokens/"+encodeURIComponent(t.id),{method:"PUT",body:JSON.stringify({role:$("#te-role").value,subject,scopes,expires_at:value?new Date(value).toISOString():null})});closeModal();loadTokens();}catch(e){err.textContent=e.message;}
  });
}

}
function openTokenModal() {
  modal(`<h3>Issue a scoped token</h3><p class="muted" style="font-size:12px">The raw token is shown once.</p>
    <div class="field"><label>Role</label><select id="t-role">
      <option value="client">client (submit/read own project)</option>

    <div class="field"><label>Subject</label><input id="t-subject" style="width:100%" placeholder="project-id / agent-id / operator" /></div>
    <div class="field"><label>Scopes <span class="muted">(KEY=VALUE, comma separated)</span></label><input id="t-scopes" style="width:100%" placeholder="projects=project-a, routes=image-generate" /></div>
    <div class="field"><label>Expires in (hours) <span class="muted">(blank = no expiry)</span></label><input id="t-expires" type="number" min="1" style="max-width:160px" /></div>
    <div class="err" id="t-err"></div>
    <div class="row" style="margin-top:14px"><button class="btn ghost" id="modal-cancel">Cancel</button><button class="btn" id="t-go">Issue</button></div>
    <div id="t-result" style="margin-top:12px"></div>`);
  $("#modal-cancel").addEventListener("click", closeModal);
  $("#t-go").addEventListener("click", async () => {
    $("#t-err").textContent=""; const role=$("#t-role").value; const subject=$("#t-subject").value.trim();
    if(!subject){$("#t-err").textContent="subject required";return;}
    const scopes={}; ($("#t-scopes").value.trim().split(",")).forEach(kv=>{const [k,v]=kv.split("=").map(s=>(s||"").trim());if(k)scopes[k]=[...(scopes[k]||[]),v];});
    const body={role,subject,scopes}; const eh=$("#t-expires").value.trim(); if(eh) body.expires_at=new Date(Date.now()+parseFloat(eh)*3600*1000).toISOString();
    try { const { json } = await api("/v1/control/tokens",{method:"POST",body:JSON.stringify(body)});
      $("#t-result").innerHTML = `<div class="field" style="margin-top:6px"><label>Token</label><textarea rows="3" readonly>${esc(json.token)}</textarea>
        <div class="hint">Store this securely; it will not be shown again.</div></div>`;
      loadTokens();
    } catch(e){ $("#t-err").textContent=e.message; }
  });
}

/* ---------------- Modal plumbing ---------------- */
function modal(html){ $("#modal-dialog").innerHTML = html; $("#modal-host").classList.remove("hidden"); }
function closeModal(){ $("#modal-host").classList.add("hidden"); }
$("#modal-host").addEventListener("click", e => { if (e.target.id === "modal-host") closeModal(); });

function errBox(e){
  let extra = "";
  if (e.status === 401) extra = "Your token may be invalid or expired. Try signing out and reconnecting.";
  else if (e.status === 403) extra = "Your token lacks permission for this action.";
  return `<div class="card" style="border-color:var(--bad)"><b style="color:var(--bad)">${esc(e.message)}</b>${extra?`<div class="sub">${extra}</div>`:""}</div>`;
}

/* ---------------- Refresh loop ---------------- */
async function refreshQuiet() {
  try {
    const { json } = await api("/v1/dashboard/overview");
    state.overview = json; renderWho();
    $("#tab-admin").classList.toggle("hidden", !json.can_administer);
    if (state.tab === "overview") refreshOverviewView();
    else if (state.tab === "jobs") fetchJobs();
    else if (state.tab === "queues") fetchQueues();
    else if (state.tab === "fleet") renderFleet();
    else if (state.tab === "admin") loadDeployments();
  } catch (e) {
    $("#autofoot").textContent = "refresh failed: " + e.message;
  }
}

/* ---------------- Bootstrap ---------------- */
function fmtAuto(){ const d=new Date(); $("#autofoot").textContent = `Auto-refresh every ${REFRESH_MS/1000}s · ${d.toLocaleTimeString()}`; }
setInterval(fmtAuto, 1000);

$("#tabs").addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (b) showTab(b.dataset.tab); });
$("#theme-btn").addEventListener("click", toggleTheme);
$("#refresh-btn").addEventListener("click", refreshQuiet);
$("#disconnect-btn").addEventListener("click", () => { if (confirm("Sign out and clear the stored token?")) disconnect(); });

$("#connect-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("#c-err").textContent = "";
  const endpoint = $("#c-endpoint").value.trim() || window.location.origin;
  const token = $("#c-token").value.trim();
  if (!token) { $("#c-err").textContent = "A bearer token is required."; return; }
  try { await doConnect(endpoint, token); }
  catch (err) { $("#c-err").textContent = err.message; }
});

(async function init(){
  updateThemeIcon();
  const c = loadCreds();
  if (c.token) {
    try { await doConnect(c.endpoint, c.token); return; }
    catch (e) { /* fall through to connect form */ }
  }
  $("#c-endpoint").value = window.location.origin;
  $("#topbar").classList.add("hidden"); $("#main").classList.add("hidden"); $("#autofoot").classList.add("hidden");
})();
</script>
</body>
</html>
